<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doblexo Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#020615;
    --panel:rgba(6,18,60,.55);
    --line:rgba(77,124,255,.35);
    --blue:#0118bd;          /* doblexo Yves Klein blue */
    --glow:#3f6dff;          /* lit-up version of the brand blue */
    --ice:#a9c1ff;           /* readable blue text */
    --pink:#FA7DE1;          /* doblexo pink flamingo = needs attention */
    --white:#eef3ff;
    --dim:#7f93c9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(ellipse at 50% 45%, rgba(1,24,189,.35), transparent 60%),
      linear-gradient(rgba(63,109,255,.06) 1px, transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg, rgba(63,109,255,.06) 1px, transparent 1px) 0 0/32px 32px,
      var(--bg);
    color:var(--white);
    font-family:'Rajdhani',system-ui,sans-serif;
    font-size:17px;
    overflow:hidden;
  }
  .orb{font-family:'Orbitron',sans-serif;letter-spacing:.08em}
  .app{
    height:100vh;display:grid;gap:12px;padding:12px 14px;
    grid-template-rows:auto 1fr auto;
  }

  /* ---------- top bar ---------- */
  header{
    display:flex;align-items:center;gap:18px;
    border:1px solid var(--line);border-radius:14px;padding:8px 18px;
    background:linear-gradient(90deg,rgba(1,24,189,.35),rgba(6,18,60,.4) 40%,rgba(250,125,225,.12));
    box-shadow:0 0 24px rgba(63,109,255,.25) inset;
  }
  .brand{display:flex;flex-direction:column;line-height:1}
  .brand b{font-family:'Orbitron';font-weight:900;font-size:26px;letter-spacing:.06em;
    background:linear-gradient(90deg,#fff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand span{font-size:12px;color:var(--ice);letter-spacing:.35em;margin-top:4px}
  .link{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ice);
    border-left:1px solid var(--line);padding-left:18px;letter-spacing:.12em}
  .dot{width:10px;height:10px;border-radius:50%;background:#5dffb0;box-shadow:0 0 10px #5dffb0;animation:blink 2s infinite}
  .sample{font-size:12px;letter-spacing:.2em;color:var(--bg);background:var(--pink);
    padding:3px 9px;border-radius:20px;font-weight:700}
  .spacer{flex:1}
  .clock{text-align:right;line-height:1}
  .clock .t{font-family:'Orbitron';font-size:34px;font-weight:700;color:#fff;text-shadow:0 0 14px var(--glow)}
  .clock .d{font-size:14px;color:var(--ice);letter-spacing:.25em;margin-top:4px}

  /* ---------- main grid ---------- */
  main{display:grid;gap:12px;min-height:0;
    grid-template-columns:1fr 1.15fr 1fr;}
  .col{display:flex;flex-direction:column;gap:12px;min-height:0}
  .panel{
    position:relative;border:1px solid var(--line);border-radius:14px;
    background:var(--panel);backdrop-filter:blur(3px);
    padding:12px 14px;min-height:0;display:flex;flex-direction:column;
    box-shadow:0 0 18px rgba(1,24,189,.35) inset;
  }
  /* corner brackets */
  .panel::before,.panel::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--glow);pointer-events:none}
  .panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:14px 0 0 0}
  .panel::after{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 14px 0}
  .panel.hot{border-color:rgba(250,125,225,.55);box-shadow:0 0 22px rgba(250,125,225,.18) inset}
  .panel.hot::before,.panel.hot::after{border-color:var(--pink)}
  .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .ph h2{font-family:'Orbitron';font-size:14px;font-weight:700;letter-spacing:.18em;color:var(--ice)}
  .ph .meta{margin-left:auto;font-size:13px;color:var(--dim);letter-spacing:.08em}
  .badge{font-family:'Orbitron';font-size:13px;padding:2px 9px;border-radius:20px;
    border:1px solid var(--pink);color:var(--pink);text-shadow:0 0 8px var(--pink)}
  .badge.ok{border-color:var(--glow);color:var(--ice);text-shadow:none}
  .scroll{overflow:auto;min-height:0;padding-right:4px}
  .scroll::-webkit-scrollbar{width:4px}.scroll::-webkit-scrollbar-thumb{background:var(--glow);border-radius:4px}

  /* alerts */
  .alert{border-left:3px solid var(--pink);background:rgba(250,125,225,.07);
    border-radius:8px;padding:9px 11px;margin-bottom:8px;display:grid;
    grid-template-columns:1fr auto;gap:2px 10px;align-items:center;transition:all .45s}
  .alert.gone{opacity:0;transform:translateX(-30px);max-height:0;padding:0 11px;margin:0}
  .alert .ty{font-weight:700;font-size:18px;color:#fff}
  .alert .dt{font-size:15px;color:var(--ice);grid-column:1}
  .alert .who{font-size:13px;color:var(--dim);letter-spacing:.06em;grid-column:1}
  .alert button{grid-row:1/4;grid-column:2}
  button{
    font-family:'Rajdhani';font-weight:700;font-size:15px;letter-spacing:.08em;
    color:#fff;background:rgba(63,109,255,.18);border:1px solid var(--glow);
    border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;
    transition:background .2s, box-shadow .2s}
  button:active{background:rgba(63,109,255,.45);box-shadow:0 0 16px var(--glow)}
  .alert button{border-color:var(--pink);background:rgba(250,125,225,.12)}
  .allclear{text-align:center;color:var(--ice);padding:22px 0;font-size:18px;letter-spacing:.1em}

  /* week bars */
  .bars{display:flex;align-items:flex-end;gap:8px;height:84px;padding-top:6px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .bar i{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--glow),rgba(1,24,189,.3));
    box-shadow:0 0 10px rgba(63,109,255,.5);transform-origin:bottom;animation:grow 1s ease-out both}
  .bar.today i{background:linear-gradient(180deg,var(--pink),rgba(250,125,225,.25));box-shadow:0 0 10px rgba(250,125,225,.5)}
  .bar small{font-size:12px;color:var(--dim);letter-spacing:.08em}

  /* center core */
  .core{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
  .core svg{width:100%;height:100%;max-height:430px;overflow:visible}
  .spin{transform-origin:200px 200px;animation:spin 40s linear infinite}
  .spin.rev{animation-duration:26s;animation-direction:reverse}
  .spin.fast{animation-duration:12s}
  .node{cursor:default}
  .shifts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .shift .big{font-family:'Orbitron';font-size:26px;font-weight:700;margin:2px 0}
  .shift .sub{font-size:15px;color:var(--ice)}
  .shift .miss{font-size:15px;color:var(--pink);margin-top:4px}

  /* lists */
  .row{display:grid;grid-template-columns:1fr 46px 90px;align-items:center;gap:10px;
    padding:6px 2px;border-bottom:1px dashed rgba(63,109,255,.18)}
  .row .n{font-size:16px;font-weight:600}
  .row .c{font-family:'Orbitron';font-size:17px;text-align:right}
  .row .meter{height:7px;border-radius:5px;background:rgba(63,109,255,.15);overflow:hidden}
  .row .meter i{display:block;height:100%;background:var(--glow);box-shadow:0 0 8px var(--glow);animation:grow-x 1.1s ease-out both;transform-origin:left}
  .row.out .c,.row.out .n{color:var(--pink)}
  .row.out .meter i{background:var(--pink);box-shadow:0 0 8px var(--pink)}

  /* message box */
  .msg{display:flex;gap:8px}
  .msg input{flex:1;min-width:0;font:inherit;font-size:16px;color:#fff;background:rgba(2,6,21,.7);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
  .msg input:focus{border-color:var(--pink);box-shadow:0 0 12px rgba(250,125,225,.35)}
  .sent{font-size:14px;color:var(--ice);margin-top:8px}
  .sent div{padding:3px 0}
  .sent em{color:var(--pink);font-style:normal;font-size:12px;letter-spacing:.1em;margin-left:6px}

  /* ticker */
  footer{border:1px solid var(--line);border-radius:12px;overflow:hidden;white-space:nowrap;
    background:rgba(6,18,60,.5);padding:8px 0;font-size:15px;color:var(--ice);position:relative}
  footer .lbl{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;padding:0 14px;
    background:var(--blue);color:#fff;font-family:'Orbitron';font-size:12px;letter-spacing:.2em;z-index:2;
    box-shadow:8px 0 16px var(--bg)}
  footer .track{display:inline-block;padding-left:100%;animation:tick 45s linear infinite}
  footer .track span{margin-right:48px}
  footer .track b{color:#fff}

  /* boot screen */
  #boot{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
  #boot.done{opacity:0;pointer-events:none}
  #boot .cup{width:120px;height:120px}
  #boot .txt{font-family:'Orbitron';letter-spacing:.3em;font-size:14px;color:var(--ice)}
  #boot .prog{width:280px;height:4px;background:rgba(63,109,255,.2);border-radius:4px;overflow:hidden}
  #boot .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--glow),var(--pink));animation:load 1.6s ease-in-out forwards}

  /* PIN screen */
  #pin{position:fixed;inset:0;z-index:40;background:rgba(2,6,21,.96);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #pin.show{display:flex}
  #pin h2{font-family:'Orbitron';letter-spacing:.25em;font-size:18px;color:var(--ice)}
  #pin .dots{display:flex;gap:14px;height:22px}
  #pin .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--glow)}
  #pin .dots i.on{background:var(--pink);border-color:var(--pink);box-shadow:0 0 10px var(--pink)}
  #pin .err{color:var(--pink);min-height:22px;font-size:17px}
  #pin .pad{display:grid;grid-template-columns:repeat(3,92px);gap:12px}
  #pin .pad button{font-family:'Orbitron';font-size:26px;height:72px}

  /* new-alert pop-up */
  #pop{position:fixed;inset:0;z-index:45;background:rgba(2,6,21,.88);display:none;
    align-items:center;justify-content:center;padding:24px}
  #pop.show{display:flex}
  #pop .box{width:min(620px,100%);max-height:90vh;overflow:auto;border:2px solid var(--pink);border-radius:18px;
    background:linear-gradient(160deg,rgba(250,125,225,.16),rgba(6,18,60,.95) 45%);
    box-shadow:0 0 40px rgba(250,125,225,.45);padding:22px 24px;animation:popin .35s ease-out}
  #pop h2{font-family:'Orbitron';letter-spacing:.2em;color:var(--pink);font-size:20px;margin-bottom:12px;
    text-shadow:0 0 12px var(--pink)}
  #pop .it{border-left:3px solid var(--pink);padding:8px 12px;margin-bottom:10px;background:rgba(2,6,21,.5);border-radius:8px}
  #pop .it b{font-size:21px;display:block}
  #pop .it span{color:var(--ice);font-size:16px}
  #pop .it small{display:block;color:var(--dim);font-size:13px;letter-spacing:.06em;margin-top:2px}
  #pop .go{width:100%;margin-top:8px;font-size:20px;min-height:58px;border-color:var(--pink);background:rgba(250,125,225,.2)}
  @keyframes popin{from{transform:scale(.92);opacity:0}}

  /* toast */
  #toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:60;background:var(--pink);color:var(--bg);
    font-weight:700;padding:10px 18px;border-radius:12px;display:none;font-size:16px}
  #toast.show{display:block}
  .link.off .dot{background:var(--pink);box-shadow:0 0 10px var(--pink)}
  .stag{font-size:11px;letter-spacing:.18em;color:var(--pink);border:1px solid var(--pink);border-radius:10px;padding:1px 7px}

  /* on the clock */
  .who-on{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px dashed rgba(63,109,255,.18)}
  .who-on .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:'Orbitron';font-size:14px;font-weight:700;
    background:rgba(63,109,255,.2);border:1px solid var(--glow);box-shadow:0 0 10px rgba(63,109,255,.4);flex:none}
  .who-on .nm{font-size:18px;font-weight:700;flex:1}
  .who-on .till{font-size:14px;color:var(--ice);letter-spacing:.04em}
  .who-on .bar2{height:4px;border-radius:3px;background:rgba(63,109,255,.15);margin-top:3px;overflow:hidden}
  .who-on .bar2 i{display:block;height:100%;background:var(--glow)}
  .who-on.gap .av{border-color:var(--pink);background:rgba(250,125,225,.15);color:var(--pink);box-shadow:0 0 10px rgba(250,125,225,.4)}
  .who-on.gap .nm{color:var(--pink)}
  .clk-sub{font-size:13px;letter-spacing:.14em;color:var(--dim);margin:10px 0 2px}
  .clk-line{font-size:15px;color:var(--ice);padding:2px 0}
  .clk-line b{color:#fff}
  .clk-line.need,.clk-line.need b{color:var(--pink)}
  .clk-empty{color:var(--ice);font-size:16px;padding:10px 0;text-align:center;letter-spacing:.06em}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{50%{opacity:.35}}
  @keyframes grow{from{transform:scaleY(0)}}
  @keyframes grow-x{from{transform:scaleX(0)}}
  @keyframes tick{to{transform:translateX(-100%)}}
  @keyframes load{to{width:100%}}
  @keyframes pulse{50%{opacity:.35}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* smaller screens: stack & scroll */
  @media (max-width:980px){
    body{overflow:auto}
    .app{height:auto}
    main{grid-template-columns:1fr}
    .core svg{max-height:360px}
  }
</style>
</head>
<body>

<div id="boot" aria-hidden="true">
  <svg class="cup" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="56" fill="none" stroke="#3f6dff" stroke-width="2" stroke-dasharray="6 6" class="spin" style="transform-origin:60px 60px"/>
    <path d="M38 48h40l-4 38a6 6 0 0 1-6 5H48a6 6 0 0 1-6-5z" fill="none" stroke="#FA7DE1" stroke-width="3" stroke-linejoin="round"/>
    <path d="M78 56h5a8 8 0 0 1 0 16h-7" fill="none" stroke="#FA7DE1" stroke-width="3"/>
    <path d="M50 40c0-5 5-5 5-10M62 40c0-5 5-5 5-10" fill="none" stroke="#a9c1ff" stroke-width="2.5" stroke-linecap="round" class="pulse"/>
  </svg>
  <div class="txt">WAKING UP DOBLEXO…</div>
  <div class="prog"><i></i></div>
</div>

<div id="pin" role="dialog" aria-label="Enter owner PIN">
  <h2>OWNER PIN</h2>
  <div class="dots" id="pinDots"></div>
  <div class="err" id="pinErr"></div>
  <div class="pad" id="pad"></div>
</div>

<div id="pop" role="alertdialog" aria-label="New staff alerts">
  <div class="box">
    <h2 id="popTitle">NEW STAFF ALERT</h2>
    <div id="popList"></div>
    <button class="go" id="popGo">GOT IT</button>
  </div>
</div>

<div id="toast" role="status"></div>

<div class="app">
  <header>
    <div class="brand"><b>doblexo</b><span>OWNER COMMAND CENTER</span></div>
    <div class="link" id="link"><span class="dot"></span> <span id="linkTxt">CONNECTING…</span></div>
    <span class="sample" id="previewTag" style="display:none" title="No server connected — showing made-up alerts">PREVIEW MODE</span>
    <div class="spacer"></div>
    <div class="clock"><div class="t" id="time">--:--</div><div class="d" id="date">—</div></div>
  </header>

  <main>
    <!-- LEFT -->
    <section class="col">
      <div class="panel hot" id="alertPanel" style="flex:0.85">
        <div class="ph"><h2>STAFF ALERTS</h2><span class="badge" id="alertCount">0 OPEN</span></div>
        <div class="scroll" id="alerts"></div>
      </div>
      <div class="panel" id="clockPanel" style="flex:1.3">
        <div class="ph"><h2>ON THE CLOCK</h2><span class="badge ok" id="onCount">—</span></div>
        <div class="scroll" id="onClock"></div>
      </div>
    </section>

    <!-- CENTER -->
    <section class="col">
      <div class="panel" style="flex:1">
        <div class="core"><svg viewBox="0 0 400 400" id="core" role="img" aria-label="Shop status overview"></svg></div>
      </div>
      <div class="shifts">
        <div class="panel shift" id="openPanel">
          <div class="ph"><h2>OPENING</h2><span class="stag">SAMPLE</span><span class="meta">TODAY</span></div>
          <div class="big" id="openBig"></div><div class="sub" id="openSub"></div><div class="miss" id="openMiss"></div>
        </div>
        <div class="panel shift" id="closePanel">
          <div class="ph"><h2>CLOSING</h2><span class="stag">SAMPLE</span><span class="meta">LAST NIGHT</span></div>
          <div class="big" id="closeBig"></div><div class="sub" id="closeSub"></div><div class="miss" id="closeMiss"></div>
        </div>
      </div>
    </section>

    <!-- RIGHT -->
    <section class="col">
      <div class="panel" style="flex:1.05">
        <div class="ph"><h2>SYRUP PREP</h2><span class="stag">SAMPLE</span><span class="meta" id="prepMeta"></span></div>
        <div class="scroll" id="prep"></div>
      </div>
      <div class="panel" style="flex:1">
        <div class="ph"><h2>STOCK COUNT</h2><span class="stag">SAMPLE</span><span class="meta" id="stockMeta"></span></div>
        <div class="scroll" id="stock"></div>
      </div>
      <div class="panel">
        <div class="ph"><h2>MESSAGE THE SHOP</h2><span class="meta">PREVIEW</span></div>
        <form class="msg" id="msgForm">
          <input id="msgIn" maxlength="120" placeholder="e.g. Catering pickup at 2pm ✨" aria-label="Message to the shop">
          <button type="submit">SEND</button>
        </form>
        <div class="sent" id="sent"></div>
      </div>
    </section>
  </main>

  <footer><div class="lbl">ACTIVITY</div><div class="track" id="ticker"></div></footer>
</div>

<script>
/* =========================================================
   SETTINGS — paste your Staff Alerts web app address here.
   (Same address your shop's Staff Alerts page uses; it ends in /exec.)
   While this still says PASTE..., the page runs in PREVIEW MODE
   with made-up alerts.
   ========================================================= */
const CONFIG = {
  ALERTS_URL: 'https://script.google.com/macros/s/AKfycby7Mp5yIdmHswJW-WCnM-s3KK4Ms_5lZbmWO4cIdEP4t8ldylACpFXrfheVDps52JQ9UA/exec',
  REFRESH_SECONDS: 30
};
const LIVE = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(CONFIG.ALERTS_URL.trim());

/* =========================================================
   Data. Alerts come from your server when connected.
   Opening/closing, prep and stock are still SAMPLE numbers
   until we connect those scripts too.
   ========================================================= */
const DATA = {
  alerts: [],          // open alerts only: {row, time, type, details, staff}
  schedule: undefined, // shifts from the schedule sheet: {date, name, start, end}
  alertsWeek: [0,0,0,0,0,0,0],
  opening: { done:14, total:14, time:"6:42 AM", initials:"MR", missed:[] },
  closing: { done:17, total:18, time:"9:18 PM", initials:"JT", missed:["Mop behind the bar"] },
  prep: { updated:"2h ago", items:[
    { name:"Vanilla syrup", count:4 },
    { name:"Brown sugar syrup", count:3 },
    { name:"Lavender syrup", count:1 },
    { name:"Caramel sauce", count:2 },
    { name:"White mocha sauce", count:0 },
    { name:"Sweet cream cold foam", count:2 },
    { name:"Strawberry cold foam", count:1 }
  ]},
  stock: { counted:"Sun 4:12 PM", by:"Jay", items:[
    { name:"Espresso beans (bags)", count:6 },
    { name:"Matcha powder (tins)", count:3 },
    { name:"Whole milk (gal)", count:8 },
    { name:"Oat milk (cartons)", count:1 },
    { name:"12 oz cups (sleeves)", count:5 },
    { name:"16 oz cups (sleeves)", count:2 },
    { name:"Lids (sleeves)", count:7 },
    { name:"Straws (boxes)", count:0 }
  ]},
  activity: []
};

const SAMPLE_ALERTS = [
  { row:101, time:new Date(Date.now()-18*60000).toISOString(), type:"Equipment not working", details:"Steam wand on group 2 is sputtering", staff:"Maria" },
  { row:102, time:new Date(Date.now()-74*60000).toISOString(), type:"Running low on something", details:"Down to the last bag of oat milk", staff:"" }
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(iso){
  const t = Date.parse(iso); if (isNaN(t)) return '';
  const m = Math.max(0, Math.round((Date.now()-t)/60000));
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  if (m < 1440) return Math.floor(m/60) + 'h ' + (m%60) + 'm ago';
  const d = Math.floor(m/1440); return d + (d === 1 ? ' day ago' : ' days ago');
}
function clock(iso){
  const t = new Date(iso); if (isNaN(t)) return '';
  return t.toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'});
}

/* ---------- small storage helpers (tablet-only) ---------- */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
let memPin = store.get('doblexo_owner_pin') || '';
let seen = new Set(JSON.parse(store.get('doblexo_seen_alerts') || '[]'));
const keyOf = a => a.row + '|' + a.time;
function saveSeen(){ store.set('doblexo_seen_alerts', JSON.stringify([...seen].slice(-300))); }

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ---------- chime (works after the first tap on the tablet) ---------- */
let audio;
function unlockAudio(){
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
document.addEventListener('pointerdown', unlockAudio, {once:true});
function chime(){
  if (!audio) return;
  try {
    if (audio.state === 'suspended') audio.resume();
    [0, .18, .36].forEach((d,i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = [880, 1175, 1568][i];
      g.gain.setValueAtTime(0.0001, audio.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.35, audio.currentTime + d + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + d + .5);
      o.connect(g).connect(audio.destination);
      o.start(audio.currentTime + d); o.stop(audio.currentTime + d + .55);
    });
  } catch(e){}
}

/* ---------- server calls ---------- */
async function api(body){
  const res = await fetch(CONFIG.ALERTS_URL.trim(), {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({ ownerPin: memPin }, body))
  });
  return res.json();
}

/* ---------- connection status ---------- */
let lastSync = 0;
function setLink(ok, text){
  $('link').classList.toggle('off', !ok);
  $('linkTxt').textContent = text;
}
setInterval(() => {
  if (!lastSync || !LIVE) return;
  const s = Math.round((Date.now()-lastSync)/1000);
  if (!$('link').classList.contains('off'))
    setLink(true, 'SHOP LINK ONLINE · SYNCED ' + (s < 60 ? s + 's AGO' : Math.floor(s/60) + 'm AGO'));
}, 5000);

/* ---------- PIN screen ---------- */
let pinBuf = '';
function showPin(msg){
  pinBuf = ''; drawPin();
  $('pinErr').textContent = msg || '';
  $('pin').classList.add('show');
}
function drawPin(){
  const n = Math.max(6, pinBuf.length);
  $('pinDots').innerHTML = Array.from({length:n}, (_,i) => `<i class="${i < pinBuf.length ? 'on' : ''}"></i>`).join('');
}
$('pad').innerHTML = ['1','2','3','4','5','6','7','8','9','⌫','0','OK']
  .map(k => `<button type="button" data-k="${k}">${k}</button>`).join('');
$('pad').addEventListener('click', e => {
  const k = e.target.closest('button')?.dataset.k; if (!k) return;
  if (k === '⌫') pinBuf = pinBuf.slice(0,-1);
  else if (k === 'OK') { if (pinBuf.length >= 4) tryPin(); return; }
  else if (pinBuf.length < 12) pinBuf += k;
  $('pinErr').textContent = ''; drawPin();
});
async function tryPin(){
  memPin = pinBuf;
  $('pinErr').textContent = 'Checking…';
  const ok = await refresh(true);
  if (ok) { store.set('doblexo_owner_pin', memPin); $('pin').classList.remove('show'); }
}

/* ---------- load alerts ---------- */
let firstLoad = true;
async function refresh(fromPin){
  if (!LIVE) return true;
  if (!memPin) { showPin(); return false; }
  let r;
  try { r = await api({ action:'list' }); }
  catch(e){ setLink(false, 'SHOP LINK OFFLINE · RETRYING'); if (fromPin) $('pinErr').textContent = 'Can’t reach the shop. Check Wi-Fi.'; return false; }

  if (!r.ok){
    if (r.error === 'bad_pin'){ memPin = ''; store.del('doblexo_owner_pin'); showPin(fromPin ? 'Wrong PIN' : 'Please enter your owner PIN'); }
    else if (r.error === 'locked'){ showPin(r.message); }
    else { setLink(false, 'SERVER: ' + (r.message || 'error').toUpperCase()); if (fromPin) $('pinErr').textContent = r.message || 'Server error'; }
    return false;
  }
  lastSync = Date.now();
  setLink(true, 'SHOP LINK ONLINE · SYNCED JUST NOW');
  DATA.schedule = r.schedule;
  applyAlerts(r.alerts || []);
  renderClock();
  return true;
}

function applyAlerts(all){
  DATA.alerts = all.filter(a => a.status === 'Open');

  // alerts per day this week (Mon → Sun)
  const now = new Date(), monday = new Date(now);
  monday.setHours(0,0,0,0); monday.setDate(monday.getDate() - ((monday.getDay()+6)%7));
  DATA.alertsWeek = [0,0,0,0,0,0,0];
  all.forEach(a => { const t = new Date(a.time); if (t >= monday) DATA.alertsWeek[(t.getDay()+6)%7]++; });

  // activity ticker: latest alerts
  DATA.activity = all.slice(0, 8).map(a =>
    `<b>${esc(clock(a.time))}</b> ${esc(a.type)}${a.staff ? ' — ' + esc(a.staff) : ''}${a.status === 'Handled' ? ' ✓ handled' : ''}`);

  // pop-up: on first load show every open alert ("while you were away"),
  // after that only alerts that are new since last check
  const fresh = DATA.alerts.filter(a => !seen.has(keyOf(a)));
  const showList = firstLoad ? DATA.alerts : fresh;
  if (showList.length) openPop(showList, firstLoad && !fresh.length);
  if (fresh.length && !firstLoad) chime();
  DATA.alerts.forEach(a => seen.add(keyOf(a))); saveSeen();
  firstLoad = false;

  renderAlerts(); renderBars(); renderTicker();
}

/* ---------- pop-up ---------- */
function openPop(list, isReminder){
  $('popTitle').textContent = isReminder
    ? `${list.length} OPEN ALERT${list.length > 1 ? 'S' : ''} WAITING`
    : (list.length > 1 ? `${list.length} NEW STAFF ALERTS` : 'NEW STAFF ALERT');
  $('popList').innerHTML = list.map(a => `
    <div class="it"><b>${esc(a.type)}</b>
      <span>${esc(a.details || '(no details)')}</span>
      <small>${esc((a.staff || 'name not given').toUpperCase())} · ${esc(ago(a.time))}</small></div>`).join('');
  $('pop').classList.add('show');
}
$('popGo').addEventListener('click', () => $('pop').classList.remove('show'));

/* ---------- alerts panel ---------- */
function renderAlerts(){
  const open = DATA.alerts;
  $('alertCount').textContent = `${open.length} OPEN`;
  $('alertCount').className = 'badge' + (open.length ? '' : ' ok');
  $('alertPanel').classList.toggle('hot', open.length > 0);
  $('alerts').innerHTML = open.length ? open.map(a => `
    <div class="alert" id="al${a.row}">
      <div class="ty">${esc(a.type)}</div>
      <div class="dt">${esc(a.details || '(no details)')}</div>
      <div class="who">${esc((a.staff || 'name not given').toUpperCase())} · ${esc(ago(a.time))}</div>
      <button data-row="${a.row}">MARK<br>HANDLED</button>
    </div>`).join('') : `<div class="allclear">✦ ALL CLEAR ✦<br><small style="color:var(--dim)">no open alerts</small></div>`;
  drawCore();
}
$('alerts').addEventListener('click', e => {
  const b = e.target.closest('button[data-row]'); if (b) handled(Number(b.dataset.row), b);
});
async function handled(row, btn){
  const a = DATA.alerts.find(x => x.row === row); if (!a) return;
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  if (LIVE){
    try {
      const r = await api({ action:'handle', row: a.row, time: a.time });
      if (!r.ok){
        toast(r.message || 'Could not mark handled');
        if (r.error === 'bad_pin') { memPin=''; store.del('doblexo_owner_pin'); showPin('Please enter your owner PIN'); }
        refresh(); return;
      }
    } catch(e){ toast('Can’t reach the shop — try again'); renderAlerts(); return; }
  }
  const el = $('al'+row); if (el) el.classList.add('gone');
  setTimeout(() => { DATA.alerts = DATA.alerts.filter(x => x.row !== row); renderAlerts(); }, 450);
}


/* ---------- on the clock (from the weekly schedule) ---------- */
function mins(t){
  const m = /^(\d{1,2})(?::(\d{2}))?\s*([AP])/i.exec(String(t).trim()); if (!m) return null;
  let h = Number(m[1]) % 12; if (m[3].toUpperCase() === 'P') h += 12;
  return h*60 + Number(m[2] || 0);
}
function short(t){ const m = mins(t); if (m == null) return t; const h = Math.floor(m/60), mm = m%60;
  return ((h+11)%12+1) + (mm ? ':' + String(mm).padStart(2,'0') : '') + (h < 12 ? 'A' : 'P'); }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const isGap = s => /^needed$/i.test(s.name);
function renderClock(){
  const box = $('onClock'), badge = $('onCount');
  if (DATA.schedule === undefined){ box.innerHTML = '<div class="clk-empty">Loading schedule…</div>'; return; }
  if (DATA.schedule === null){ badge.textContent = '—'; box.innerHTML = '<div class="clk-empty">Can’t read the schedule sheet</div>'; return; }
  const now = new Date(), today = ymd(now), nowM = now.getHours()*60 + now.getMinutes();
  const todays = DATA.schedule.filter(s => s.date === today)
    .map(s => Object.assign({ a: mins(s.start), b: mins(s.end) }, s)).filter(s => s.a != null && s.b != null)
    .sort((x,y) => x.a - y.a);
  if (!DATA.schedule.length || (!todays.length && !DATA.schedule.some(s => s.date > today))){
    badge.textContent = '—'; badge.className = 'badge';
    box.innerHTML = '<div class="clk-empty">No schedule for this week yet</div>'; return;
  }
  const on = todays.filter(s => s.a <= nowM && nowM < s.b);
  const staffOn = on.filter(s => !isGap(s)), gapsNow = on.filter(isGap);
  const next = todays.filter(s => s.a > nowM && !isGap(s));
  const gapsLater = todays.filter(s => s.a > nowM && isGap(s));
  badge.textContent = staffOn.length + ' ON';
  badge.className = 'badge' + (staffOn.length && !gapsNow.length ? ' ok' : '');
  $('clockPanel').classList.toggle('hot', gapsNow.length > 0);

  let h = '';
  if (on.length){
    h += on.map(s => {
      const pct = Math.min(100, Math.max(0, (nowM - s.a) / (s.b - s.a) * 100));
      return `<div class="who-on ${isGap(s) ? 'gap' : ''}">
        <div class="av">${isGap(s) ? '!' : esc(s.name.charAt(0).toUpperCase())}</div>
        <div style="flex:1"><div style="display:flex;align-items:baseline;gap:8px">
          <span class="nm">${isGap(s) ? 'Nobody scheduled' : esc(s.name)}</span>
          <span class="till">${short(s.start)} – ${short(s.end)}</span></div>
          <div class="bar2"><i style="width:${pct}%"></i></div></div></div>`;
    }).join('');
  } else {
    const later = todays.filter(s => s.a > nowM);
    h += `<div class="clk-empty">${later.length ? 'Nobody on yet' : 'Shop’s closed for the day ✦'}</div>`;
  }
  if (next.length){
    h += '<div class="clk-sub">COMING UP</div>' + next.slice(0,3).map(s =>
      `<div class="clk-line"><b>${esc(s.name)}</b> at ${short(s.start)} <span style="color:var(--dim)">(till ${short(s.end)})</span></div>`).join('');
  }
  // unfilled shifts later today or in the next 7 days
  const upcoming = DATA.schedule.filter(s => isGap(s) && (s.date > today));
  const gapLines = gapsLater.map(s => `Today ${short(s.start)}–${short(s.end)}`)
    .concat(upcoming.map(s => {
      const d = new Date(s.date + 'T12:00:00');
      return d.toLocaleDateString([], {weekday:'short'}) + ' ' + short(s.start) + '–' + short(s.end);
    }));
  if (gapLines.length){
    h += '<div class="clk-sub" style="color:var(--pink)">STILL NEEDS SOMEONE</div>' +
      gapLines.slice(0,4).map(l => `<div class="clk-line need"><b>✕</b> ${esc(l)}</div>`).join('') +
      (gapLines.length > 4 ? `<div class="clk-line need">+${gapLines.length-4} more</div>` : '');
  }
  box.innerHTML = h;
}
setInterval(renderClock, 60000);

/* ---------- clock ---------- */
function tick(){
  const d = new Date();
  $('time').textContent = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  $('date').textContent = d.toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'}).toUpperCase();
}
tick(); setInterval(tick, 1000);

/* ---------- week bars ---------- */
function renderBars(){
  if (!$('bars')) return;
  const days = ['M','T','W','T','F','S','S'];
  const max = Math.max(...DATA.alertsWeek, 1);
  const today = (new Date().getDay() + 6) % 7;
  $('bars').innerHTML = DATA.alertsWeek.map((v,i) => `
    <div class="bar ${i===today?'today':''}">
      <small style="color:var(--white)">${v}</small>
      <i style="height:${Math.max(v/max*70,3)}%;animation-delay:${i*.08}s"></i>
      <small>${days[i]}</small>
    </div>`).join('');
  $('weekTotal').textContent = DATA.alertsWeek.reduce((a,b)=>a+b,0) + ' TOTAL';
}

/* ---------- opening / closing (sample) ---------- */
function renderShifts(){
  [['open',DATA.opening],['close',DATA.closing]].forEach(([k,s]) => {
    const ok = s.done === s.total;
    $(k+'Big').innerHTML = `<span style="color:${ok?'#fff':'var(--pink)'}">${s.done}/${s.total}</span> ${ok?'<span style="color:var(--glow)">✓</span>':''}`;
    $(k+'Sub').textContent = `Done ${s.time} · ${s.initials}`;
    $(k+'Miss').textContent = s.missed.length ? '✕ ' + s.missed.join(', ') : '';
    $(k+'Panel').classList.toggle('hot', !ok);
  });
}

/* ---------- prep & stock lists (sample) ---------- */
function list(el, items){
  const max = Math.max(...items.map(i=>i.count), 1);
  $(el).innerHTML = items.map(i => `
    <div class="row ${i.count===0?'out':''}">
      <span class="n">${esc(i.name)}</span>
      <span class="c">${i.count}</span>
      <span class="meter"><i style="width:${Math.max(i.count/max*100,2)}%"></i></span>
    </div>`).join('');
}
function renderLists(){
  list('prep', DATA.prep.items);
  $('prepMeta').textContent = 'UPDATED ' + DATA.prep.updated.toUpperCase();
  list('stock', DATA.stock.items);
  $('stockMeta').textContent = DATA.stock.counted.toUpperCase() + ' · ' + DATA.stock.by.toUpperCase();
}

/* ---------- center core ---------- */
function arc(r, frac){ const c = 2*Math.PI*r; return `stroke-dasharray="${c*frac} ${c}"`; }
function drawCore(){
  const o = DATA.opening, cl = DATA.closing;
  const open = DATA.alerts.length;
  const outs = [...DATA.prep.items, ...DATA.stock.items].filter(i=>i.count===0).length;
  const P = 'var(--pink)', G = 'var(--glow)';
  const ticks = Array.from({length:72},(_,i)=>{
    const a = i*5*Math.PI/180, r1 = i%6===0?166:171, r2=178;
    return `<line x1="${200+r1*Math.cos(a)}" y1="${200+r1*Math.sin(a)}" x2="${200+r2*Math.cos(a)}" y2="${200+r2*Math.sin(a)}" stroke="#3f6dff" stroke-opacity="${i%6===0?.9:.35}" stroke-width="${i%6===0?2:1}"/>`;
  }).join('');
  const nodes = [
    { a:-90, label:'ALERTS',  val: open ? `${open} OPEN` : 'CLEAR', hot: open>0 },
    { a:-18, label:'OPENING', val: `${o.done}/${o.total}`, hot: o.done<o.total },
    { a: 54, label:'CLOSING', val: `${cl.done}/${cl.total}`, hot: cl.done<cl.total },
    { a:126, label:'PREP',    val: DATA.prep.updated.toUpperCase(), hot:false },
    { a:198, label:'OUT OF',  val: outs ? `${outs} ITEMS` : 'NONE', hot: outs>0 }
  ].map(n => {
    const rad = n.a*Math.PI/180, x = 200+196*Math.cos(rad), y = 200+196*Math.sin(rad);
    const lx = 200+150*Math.cos(rad), ly = 200+150*Math.sin(rad);
    const col = n.hot ? P : G;
    return `<g class="node">
      <line x1="${lx}" y1="${ly}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="${x}" cy="${y}" r="7" fill="var(--bg)" stroke="${col}" stroke-width="2" ${n.hot?'class="pulse"':''}/>
      <text x="${x}" y="${y-14}" text-anchor="middle" font-family="Orbitron" font-size="10" fill="#a9c1ff" letter-spacing="1.5">${n.label}</text>
      <text x="${x}" y="${y+24}" text-anchor="middle" font-family="Orbitron" font-size="12" font-weight="700" fill="${n.hot?'#FA7DE1':'#fff'}">${n.val}</text>
    </g>`;
  }).join('');

  $('core').innerHTML = `
    <defs>
      <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="cg"><stop offset="0" stop-color="#0118bd" stop-opacity=".55"/><stop offset="1" stop-color="#0118bd" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="200" cy="200" r="150" fill="url(#cg)"/>
    <g class="spin">${ticks}</g>
    <circle cx="200" cy="200" r="158" fill="none" stroke="#3f6dff" stroke-opacity=".5" stroke-width="1" stroke-dasharray="40 10 4 10" class="spin rev"/>
    <circle cx="200" cy="200" r="138" fill="none" stroke="rgba(63,109,255,.15)" stroke-width="10"/>
    <circle cx="200" cy="200" r="138" fill="none" stroke="${o.done<o.total?P:G}" stroke-width="10" stroke-linecap="round"
      ${arc(138,o.done/o.total)} transform="rotate(-90 200 200)" filter="url(#gl)"/>
    <circle cx="200" cy="200" r="118" fill="none" stroke="rgba(63,109,255,.15)" stroke-width="8"/>
    <circle cx="200" cy="200" r="118" fill="none" stroke="${cl.done<cl.total?P:G}" stroke-width="8" stroke-linecap="round"
      ${arc(118,cl.done/cl.total)} transform="rotate(-90 200 200)" filter="url(#gl)"/>
    <circle cx="200" cy="200" r="100" fill="none" stroke="#FA7DE1" stroke-opacity=".6" stroke-width="2" stroke-dasharray="2 8" class="spin fast"/>
    <circle cx="200" cy="200" r="86" fill="rgba(2,6,21,.85)" stroke="#3f6dff" stroke-width="1.5"/>
    <text x="200" y="178" text-anchor="middle" font-family="Orbitron" font-size="11" fill="#a9c1ff" letter-spacing="3">SHOP STATUS</text>
    <text x="200" y="215" text-anchor="middle" font-family="Orbitron" font-size="30" font-weight="900"
      fill="${open||outs?'#FA7DE1':'#fff'}" filter="url(#gl)">${open||outs ? 'CHECK' : 'ALL GOOD'}</text>
    <text x="200" y="240" text-anchor="middle" font-family="Rajdhani" font-size="14" fill="#a9c1ff">
      ${open ? open+' alert'+(open>1?'s':'')+' · ' : ''}${outs ? outs+' item'+(outs>1?'s':'')+' out' : 'nothing out'}</text>
    ${nodes}`;
}
